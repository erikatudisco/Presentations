				## Method (Lab)
				* Consolidated drained triaxial tests
					* 100mm diameter reconstituted samples
					* Preconsolidated at mean effective stress of 500 kPa
				* X-ray tomography
					* Two scans (Before shearing (pre-mortem) & After failure (post-mortem))
					* Pixel size: 65 microns
					* Acquisition time: 50 minutes
				<!-- Placeholder for the table and lab photo -->

			<!-- SLIDE 8: CPT -->
			<section data-markdown>
				<textarea data-template>
				## CPT
				* $c_u$ calculation: \[c_u = \frac{q_t - \sigma_{v0}}{N_{kt}}\]
				* $N_{kt}$ = 11 as per SGI recommendation (Larsson and Åhnberg, 2003)
				* Average $c_u$ of 350 kPa 1,5m depth
				* In line with previous research between 200 – 400 kPa (Dueck, 1995; Larsson, 2001)
				* With current basic assumption:
					* $\phi'$ = 30 - 32°
					* $c'$ = 0,1 $c_u$ = 35 kPa
				<!-- Placeholder for the CPT chart image -->
				</textarea>
			</section>
			
			<!-- SLIDE 9: CD Triaxial Tests 1 -->
			<section data-markdown>
				<textarea data-template>
				## CD Triaxial Tests
				* Obtaining drained parameters
					* Mohr’s circle
					* p’-q diagram
					* $\phi'$ = 51°
					* $c'$ = 21,7 kPa
				* Formulas used:
					* Slope : d, Intercept : m
					* $\phi'$ : arcsin(tan d)
					* $c'$ : m/cos($\phi'$)
				<!-- Placeholder for the charts images -->
				</textarea>
